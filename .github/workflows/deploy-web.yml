# Production web deployment: push to main -> build -> Cloudflare Pages.
#
# This restores the workflow `e4680fd` removed, with the defect that made it
# unusable corrected.
#
# Why the previous version was removed: it ran a bare `flutter build web
# --release` with no `--dart-define`. This app reads its Supabase configuration
# from `String.fromEnvironment` (`app/lib/core/config.dart`), so a build without
# those two values compiles and deploys successfully and then shows the
# "Supabase configuration missing" screen to every visitor
# (`app/lib/core/config_error_app.dart`). The pipeline could only ever publish a
# broken site, which is why production has been built by hand since.
#
# The correction is the two `--dart-define` values below, supplied from repository
# secrets, plus a guard that fails the run if they did not reach the bundle.
#
# Only the publishable (anon) key is ever passed. `Docs/engineering/
# SUPABASE_OPERATIONAL_GUIDELINES.md` is explicit that the service-role key is
# never in source, never in a build and never in a `--dart-define`; nothing here
# handles it.
#
# Staleness: the runner is ephemeral and `app/build/` is gitignored, so every
# deployment is compiled from the commit that triggered the run. There is no
# path by which a previous bundle can be published.

name: Deploy web app to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deployment at a time. Two pushes in quick succession would
# otherwise race, and the loser could publish the older bundle last.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The four secrets below are Environment secrets, not repository secrets,
    # and GitHub makes those available only to a job that uses the environment.
    # Without this line every `secrets.*` reference resolves to an empty string
    # and the run fails at "Require the build configuration" — which is what
    # happened on the first run.
    environment: github-pages
    env:
      # Wave 4. The one statement of what this deployment is and where it is
      # served: both the build and the post-deploy smoke check read these.
      # `PUBLIC_WEB_BASE` is the current production address -- the value
      # `AppConfig.publicWebBase` already defaults to -- stated here once so no
      # second copy is needed for the smoke check.
      DEPLOYMENT_ENV: production
      PUBLIC_WEB_BASE: https://go-play-44y.pages.dev
    steps:
      # Wave 4 release integrity: production is published from `main` only.
      # A push to main and a manual run started from main both pass. A manual
      # run started from any other branch or ref fails here -- visibly, before
      # anything is checked out, built or published -- rather than being
      # skipped as though nothing had been asked.
      - name: Require the main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::production deploys only from refs/heads/main; this run is on $GITHUB_REF"
            exit 1
          fi

      - name: Check out the commit being deployed
        uses: actions/checkout@v4

      # The build identity: the version from pubspec.yaml and the commit that
      # was actually checked out, not the one that triggered the run.
      - name: Derive the build identity
        run: |
          APP_VERSION="$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml | head -n 1 | tr -d '[:space:]')"
          BUILD_SHA="$(git rev-parse HEAD)"
          test -n "$APP_VERSION" || { echo "::error::no version in app/pubspec.yaml"; exit 1; }
          echo "$BUILD_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::checked-out HEAD is not a commit SHA"; exit 1; }
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_SHA=$BUILD_SHA" >> "$GITHUB_ENV"

      # Fail before the build rather than after the deployment. Without this a
      # missing secret produces a green run and a broken site — the exact
      # failure mode this workflow exists to prevent.
      - name: Require the build configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL"      || { echo "::error::secret SUPABASE_URL is not set"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "::error::secret SUPABASE_ANON_KEY is not set"; exit 1; }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version the release was developed and validated on.
          # An unpinned `stable` makes the output depend on the day the run
          # happens rather than on the commit.
          flutter-version: 3.44.7

      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get

      # Before the build, because `flutter build web` copies `web/` as it finds
      # it. The service worker cannot read a `--dart-define`, so its half of the
      # configuration is substituted here; the runner is ephemeral, so the file
      # only ever exists for this one build.
      #
      # Not guarded, and it does not fail on missing secrets: it writes an inert
      # worker instead, matching a bundle whose `FirebaseWebConfig.isConfigured`
      # is false. A site without push still deploys.
      - name: Generate the Firebase messaging service worker
        working-directory: app
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: dart run tool/generate_firebase_sw.dart

      - name: Build the web release
        working-directory: app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Web push. Deliberately *not* in the guard above: unset means the
          # site builds without push and behaves exactly as it did before, so
          # failing the deployment over it would trade a working site for a
          # missing notification. `FirebaseWebConfig.isConfigured` is the same
          # decision expressed in Dart.
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_VAPID_KEY: ${{ secrets.FIREBASE_WEB_VAPID_KEY }}
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=FIREBASE_WEB_API_KEY="$FIREBASE_WEB_API_KEY" \
            --dart-define=FIREBASE_WEB_APP_ID="$FIREBASE_WEB_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_WEB_VAPID_KEY="$FIREBASE_WEB_VAPID_KEY" \
            --dart-define=PUBLIC_WEB_BASE="$PUBLIC_WEB_BASE" \
            --dart-define=GOPLAY_DEPLOYMENT_ENV="$DEPLOYMENT_ENV" \
            --dart-define=GOPLAY_APP_VERSION="$APP_VERSION" \
            --dart-define=GOPLAY_BUILD_SHA="$BUILD_SHA"

      # The build above succeeds whether or not the values were compiled in, so
      # the bundle is checked rather than trusted. `grep -q` prints nothing, so
      # no secret reaches the log.
      - name: Verify the configuration reached the bundle
        run: |
          grep -q 'supabase\.co' app/build/web/main.dart.js \
            || { echo "::error::built bundle carries no Supabase URL"; exit 1; }
          if grep -q 'service_role' app/build/web/main.dart.js; then
            echo "::error::a service-role key reached the web bundle"
            exit 1
          fi
          # Proof that the bundle about to be published was compiled from this
          # commit's source and not recovered from a cache. `v_completed_matches`
          # entered the source in `0b3fb0f`; a bundle without it is older than
          # that commit, which is exactly the staleness that made the Community
          # Statistics count read zero while the database held two.
          grep -q 'v_completed_matches' app/build/web/main.dart.js \
            || { echo "::error::bundle predates 0b3fb0f — stale build, refusing to deploy"; exit 1; }

      # Published with the site, so the smoke check below can prove the primary
      # URL serves exactly this commit. Version, commit and environment only.
      - name: Record the build identity in the published site
        working-directory: app
        run: |
          dart run tool/release_gate.dart write-build-info \
            --out build/web/build-info.json \
            --version "$APP_VERSION" \
            --sha "$BUILD_SHA" \
            --environment "$DEPLOYMENT_ENV"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `--branch=main` is what makes this a PRODUCTION deployment, and it
          # is required rather than optional.
          #
          # Cloudflare decides production vs preview by whether the deployed
          # branch matches the project's configured production branch; a
          # deployment on any other branch is a preview. This project's
          # production branch is `main` — `820ca12` created it with
          # `pages project create go-play --production-branch main` — so
          # `--branch=main` lands on production.
          #
          # Omitting the flag is the unsafe option here, not the safe one.
          # Wrangler then infers the branch from git metadata, and
          # `actions/checkout` leaves the repository on a detached HEAD, so the
          # inferred name is not reliably `main`. Anything else silently
          # publishes a preview, and production keeps serving the old bundle —
          # the same invisible-staleness failure this pipeline exists to stop.
          #
          # The project must already exist: this workflow deliberately does not
          # create one, so a wrong name fails the run instead of silently
          # publishing to a second, empty project.
          command: pages deploy app/build/web --project-name=go-play --branch=main

      # After publication: the primary URL must serve this exact build -- `/`,
      # the bootstrap, the bundle and `build-info.json` answer 200, the SHA and
      # environment match, the bundle carries the Supabase URL and no
      # service_role. Bounded retries; a failure fails the run for review and
      # rolls nothing back.
      - name: Smoke-check the published site
        working-directory: app
        run: |
          dart run tool/release_gate.dart smoke \
            --url "$PUBLIC_WEB_BASE" \
            --sha "$BUILD_SHA" \
            --environment "$DEPLOYMENT_ENV"
