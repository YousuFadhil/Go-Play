name: go_play
description: Football community manager MVP.
publish_to: none
version: 0.4.1-public-beta+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # The Balanced Team Generation Engine. Pure Dart, no Flutter and no provider,
  # so it is a Domain-side dependency rather than an infrastructure one.
  btge:
    path: ../packages/btge
  intl: any
  shared_preferences: ^2.3.0
  supabase_flutter: ^2.8.0
  # Already in the graph beneath supabase_flutter, declared here only because
  # the failure mapper names ClientException to classify a dropped connection
  # without dart:io. No version moves: this is the version already locked.
  http: ^1.6.0
  image_picker: ^1.2.3
  # Push delivery only. The Notification Center is Supabase either way, and the
  # app runs without a Firebase project configured — see PushService.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  # The OS share sheet. Flutter ships no sharing API, and the alternative is
  # hand-written platform channels plus an Android FileProvider — for three
  # platforms — to reach something every OS already provides. One package, and
  # the only file that names it is NativeShareService.
  #
  # It also owns the temporary file: the card is handed over as bytes and
  # share_plus writes them into the OS temporary directory on the platforms
  # that need a path. So the app writes nothing itself, which is what keeps
  # `dart:io` out of this feature and the web build compiling.
  share_plus: ^13.3.0
  # The browser, for the one thing the share sheet cannot do everywhere: hand
  # the reader the picture to keep. Desktop Chrome and Firefox implement no file
  # sharing, so a card composed there has nowhere to go without a download, and
  # a download needs a Blob and an anchor.
  #
  # Already in the graph beneath share_plus, declared here only because
  # `image_downloader_web.dart` names it directly. No version moves: this is the
  # version already locked, and the same reason `http` is declared above.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
