name: go_play
description: Football community manager MVP.
publish_to: none
version: 0.4.0-public-beta+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # The Balanced Team Generation Engine. Pure Dart, no Flutter and no provider,
  # so it is a Domain-side dependency rather than an infrastructure one.
  btge:
    path: ../packages/btge
  intl: any
  shared_preferences: ^2.3.0
  supabase_flutter: ^2.8.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
