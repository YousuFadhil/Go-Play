<style>body{margin:0;padding:20px;background:var(--bg-page);font:var(--type-body-medium)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:12px}.lbl{font:var(--type-label-small);letter-spacing:.5px;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { TextField, SelectField, SegmentedControl, SwitchRow } = window.GoPlayDesignSystem_984b89;

  <div style={{background:'var(--surface-card)',border:'1px solid var(--border-hairline)',borderRadius:'var(--radius-md)'}}>
    <SwitchRow label="Match notifications" subtitle="Registration, player changes and reminders." checked={on} onChange={setOn}/>
  </div>
</div>);}
